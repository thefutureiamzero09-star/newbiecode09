
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slideshow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .slideshow {
            width: 100%;
            max-width: 1200px;
            height: 450px;
            margin: 30px auto;
            position: relative;
            overflow: hidden;
        }
        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .slide.active {
            opacity: 1;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .prev,.next {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 45px;
            height: 60px;
            border: none;
            background: rgba(0, 0, 0, 0.4);
            color: white;
            font-size: 30px;
            cursor: pointer;
            z-index: 10;
        }
        .prev {
            left: 10px;
        }
        .next {
            right: 10px;
        }
        .prev:hover,
        .next:hover {
            background: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>

<body>
    <div class="slideshow">
        <div class="slide active">
            <img src="/HtmlCssJs/Img/cod5.jpg" alt="Banner 1">
        </div>

        <div class="slide">
            <img src="/HtmlCssJs/Img/cod6.jpg" alt="Banner 2">
        </div>

        <div class="slide">
            <img src="/HtmlCssJs/Img/cod3.jpg" alt="Banner 3">
        </div>
        <div class="slide">
            <img src="/HtmlCssJs/Img/cod2.jpg" alt="Banner 3">
        </div>
        <div class="slide">
            <img src="/HtmlCssJs/Img/cod4.jpg" alt="Banner 3">
        </div>

        <button class="prev" onclick="prevSlide()">❮</button>
        <button class="next" onclick="nextSlide()">❯</button>
    </div>

    <script>
    const slides = document.querySelectorAll(".slide");
    let currentSlide = 0;

    function showSlide(index) {
        slides.forEach(slide => {
            slide.classList.remove("active");
        });

        slides[index].classList.add("active");
    }
    function nextSlide() {
        currentSlide++;

            if (currentSlide >= slides.length) {
                currentSlide = 0;
            }
            showSlide(currentSlide);
    }
    function prevSlide() {
        currentSlide--;

            if (currentSlide < 0) {
                currentSlide = slides.length - 1;
            }
            showSlide(currentSlide);
    }
    showSlide(currentSlide);
</script>


</body>
</html>
