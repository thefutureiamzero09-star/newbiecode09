<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<div class="runUp">
    <span class="star">★</span>
</div>
</body>
</html>


<style>
.runUp {
    width: 200px;
    height: 200px;
    border: 2px solid purple;
    position: relative;
    margin-left: 650px;
}
.star {
    position: absolute;
    left: -12px;
    top: -12px;
    font-size: 24px;
    color: purple;
    animation: move 10s linear infinite;
}
@keyframes move {
    0% {
        left: -12px;
        top: -12px;
    }
    25% {
        left: calc(100% - 12px);
        top: -12px;
    }
    50% {
        left: calc(100% - 12px);
        top: calc(100% - 12px);
    }
    75% {
        left: -12px;
        top: calc(100% - 12px);
    }
    100% {
        left: -12px;
        top: -12px;
    }
}

</style>
